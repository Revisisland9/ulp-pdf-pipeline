<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; color: #202124; }
    label, input, button { display: block; margin-bottom: 12px; }
    input { max-width: 100%; }
    button { background: #174ea6; color: white; border: 0; border-radius: 6px; padding: 9px 14px; }
    button:disabled { opacity: .6; }
    fieldset { margin: 12px 0; border: 1px solid #dadce0; }
    fieldset label { margin-bottom: 6px; }
    fieldset input, fieldset select { box-sizing: border-box; width: 100%; margin: 4px 0 8px; }
    [role=status] { line-height: 1.5; }
  </style>
</head>
<body>
  <form id="upload">
    <label for="document">Shipment document</label>
    <input id="document" name="document" type="file" accept=".eml,.pdf,.png,.jpg,.jpeg" required>
    <button type="submit">Upload and extract</button>
  </form>
  <button type="button" id="check">Check connection</button>
  <p>Select a shipment row to review its details. Choose a TFWW account in column B before submitting.</p>
  <button type="button" id="review-row">Review selected row</button>
  <button type="button" id="submit-tfww">Submit to TFWW</button>
  <p role="status" id="status"></p>
  <form id="review" hidden>
    <div id="review-fields"></div>
    <button type="submit">Save reviewed fields</button>
  </form>
  <script>
    (() => {
      const form = document.getElementById('upload');
      const uploadButton = form.querySelector('button');
      const checkButton = document.getElementById('check');
      const submitButton = document.getElementById('submit-tfww');
      const reviewButton = document.getElementById('review-row');
      const reviewForm = document.getElementById('review');
      const reviewFields = document.getElementById('review-fields');
      const statusText = document.getElementById('status');

      function setBusy(busy) {
        uploadButton.disabled = busy;
        checkButton.disabled = busy;
        submitButton.disabled = busy || !reviewForm.hidden;
        reviewButton.disabled = busy;
      }

      function showFailure(stage, error) {
        setBusy(false);
        statusText.textContent = stage + ': ' +
          (error?.message || 'The browser could not complete the Apps Script request.');
      }

      checkButton.addEventListener('click', () => {
        setBusy(true);
        statusText.textContent = 'Checking Apps Script and Cloud Run…';
        try {
          google.script.run
            .withSuccessHandler(message => {
              setBusy(false);
              statusText.textContent = message;
            })
            .withFailureHandler(error => showFailure('Connection check failed', error))
            .checkUploadConnection();
        } catch (error) {
          showFailure('Could not start the connection check', error);
        }
      });

      let review;
      const addressFields = {
        name: 'Name', address1: 'Street address', address2: 'Suite or unit',
        city: 'City', state: 'State or province', postal_code: 'Postal code',
        country_code: 'Country code', contact_name: 'Contact name',
        phone: 'Contact phone', email: 'Contact email', is_residential: 'Residential'
      };
      const itemFields = {
        description: 'Description', quantity: 'Quantity', quantity_uom: 'Quantity unit',
        weight: 'Total row weight', weight_uom: 'Weight unit', length: 'Length', width: 'Width',
        height: 'Height', dimension_uom: 'Dimension unit', freight_class: 'Freight class',
        nmfc: 'NMFC code', hazardous_material: 'Hazardous material'
      };
      const numeric = ['quantity', 'weight', 'length', 'width', 'height'];

      function addFields(title, record, fields) {
        const group = document.createElement('fieldset');
        const legend = document.createElement('legend');
        legend.textContent = title;
        group.append(legend);
        for (const [key, title] of Object.entries(fields)) {
          const label = document.createElement('label');
          label.textContent = title;
          const boolean = ['is_residential', 'hazardous_material'].includes(key);
          const input = document.createElement(boolean ? 'select' : 'input');
          input.name = key;
          if (boolean) {
            input.add(new Option('Not confirmed', ''));
            input.add(new Option('Yes', 'true'));
            input.add(new Option('No', 'false'));
          } else if (numeric.includes(key)) {
            input.type = 'number';
            input.step = 'any';
          }
          input.value = String(record[key] ?? '');
          input.addEventListener(boolean ? 'change' : 'input', () => {
            record[key] = input.value.trim() === '' ? null
              : boolean ? input.value === 'true'
              : numeric.includes(key) ? input.valueAsNumber : input.value.trim();
          });
          label.append(input);
          group.append(label);
        }
        reviewFields.append(group);
        return group;
      }

      function addDimensionUnitControl(items, groups) {
        const missing = items.flatMap((item, index) =>
          !item.dimension_uom && ['length', 'width', 'height'].every(key => item[key] > 0)
            ? [groups[index].querySelector('[name="dimension_uom"]')] : []
        );
        if (!missing.length) return;

        const label = document.createElement('label');
        label.textContent = 'Confirmed unit for dimensions with a blank unit';
        const input = document.createElement('input');
        const apply = document.createElement('button');
        apply.type = 'button';
        apply.textContent = 'Fill blank dimension units';
        apply.addEventListener('click', () => {
          const unit = input.value.trim();
          if (!unit) return;
          for (const target of missing) {
            if (target.value.trim()) continue;
            target.value = unit;
            target.dispatchEvent(new Event('input'));
          }
        });
        label.append(input);
        reviewFields.insertBefore(label, groups[0]);
        reviewFields.insertBefore(apply, groups[0]);
      }

      reviewButton.addEventListener('click', () => {
        selectedShipment = undefined;
        submitButton.textContent = 'Submit to TFWW';
        setBusy(true);
        google.script.run
          .withFailureHandler(error => showFailure('Review', error))
          .withSuccessHandler(result => {
            review = result;
            reviewFields.replaceChildren();
            const shipment = result.shipment;
            addFields('References', shipment.reference, {
              load_id: 'Load ID', sales_order: 'Sales order', purchase_order: 'Purchase order'
            });
            addFields('Shipper', shipment.shipper, addressFields);
            addFields('Consignee', shipment.consignee, addressFields);
            const commodityGroups = shipment.items.map((item, index) =>
              addFields('Commodity ' + (index + 1), item, itemFields)
            );
            addDimensionUnitControl(shipment.items, commodityGroups);
            const services = {descriptions: shipment.source_services.join(', ')};
            addFields('Services', services, {descriptions: 'Service descriptions, separated by commas'});
            reviewFields.lastElementChild.addEventListener('input', () => {
              shipment.source_services = (services.descriptions || '').split(',').map(value => value.trim()).filter(Boolean);
            });
            reviewForm.hidden = false;
            setBusy(false);
            statusText.textContent = 'Reviewing row ' + result.row + ' (' + result.filename + '). ' + result.notes;
          })
          .loadShipmentForReview();
      });

      reviewForm.addEventListener('submit', event => {
        event.preventDefault();
        const save = reviewForm.querySelector('button');
        if (save.disabled) return;
        save.disabled = true;
        setBusy(true);
        google.script.run
          .withFailureHandler(error => {
            save.disabled = false;
            showFailure('Save review', error);
          })
          .withSuccessHandler(row => {
            reviewForm.hidden = true;
            save.disabled = false;
            setBusy(false);
            statusText.textContent = 'Saved reviewed details for row ' + row + '.';
          })
          .saveShipmentReview(JSON.stringify(review));
      });

      let selectedShipment;
      submitButton.addEventListener('click', () => {
        setBusy(true);
        if (!selectedShipment) {
          google.script.run
            .withFailureHandler(error => showFailure('Submission', error))
            .withSuccessHandler(selection => {
              selectedShipment = selection;
              setBusy(false);
              submitButton.textContent = 'Confirm submission';
              statusText.textContent = 'Send row ' + selection.row + ' (' +
                selection.filename + ') to ' + selection.account + '?';
            })
            .selectedShipmentForSubmit();
          return;
        }
        const selection = selectedShipment;
        selectedShipment = undefined;
        submitButton.textContent = 'Submit to TFWW';
        statusText.textContent = 'Submitting to TFWW…';
        google.script.run
          .withSuccessHandler(result => {
            setBusy(false);
            statusText.textContent = 'Row ' + result.row + ': ' + result.status +
              '. See column G for the result.';
          })
          .withFailureHandler(error => showFailure('Submission', error))
          .submitSelectedShipment(selection);
      });

      form.addEventListener('submit', event => {
        event.preventDefault();
        if (uploadButton.disabled) return;
        const file = form.elements.namedItem('document').files[0];
        if (!file || !file.size || file.size > 20 * 1024 * 1024) {
          statusText.textContent = 'Choose a nonempty file up to 20 MiB.';
          return;
        }

        setBusy(true);
        statusText.textContent = 'Sending the file to Apps Script…';
        try {
          google.script.run
            .withSuccessHandler(result => {
              form.reset();
              setBusy(false);
              const review = result.hasZip ? '' : ' Enter the origin ZIP if available.';
              statusText.textContent = 'Added row ' + result.row + '.' + review +
                ' Choose a TFWW account in column B.';
            })
            .withFailureHandler(error => showFailure('Upload failed', error))
            .uploadShipment(form);
        } catch (error) {
          showFailure('Could not start the upload', error);
        }
      });
    })();
  </script>
</body>
</html>
